name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  framework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build RemoteAU.xcframework (gomobile)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p ios/Frameworks
          gomobile bind -target ios,iossimulator \
            -o ios/Frameworks/RemoteAU.xcframework -prefix RemoteAU ./engine/mobile

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAU-xcframework
          path: ios/Frameworks/RemoteAU.xcframework

  build:
    needs: framework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download framework
        uses: actions/download-artifact@v4
        with:
          name: RemoteAU-xcframework
          path: ios/Frameworks

      - name: Enable v2 in project
        run: python3 scripts/add-v2-dep.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project RemoteAU.xcodeproj -scheme RemoteAU \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/RemoteAU.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R "build/RemoteAU.xcarchive/Products/Applications/RemoteAU.app" build/Payload/
          cd build && rm -f RemoteAU.ipa && zip -qry RemoteAU.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAU-unsigned-ipa
          path: ios/build/RemoteAU.ipa
